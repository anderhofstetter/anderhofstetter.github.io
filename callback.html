<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorization complete</title>
<style>body{font-family:system-ui,Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}code{background:#eee;padding:2px 6px;border-radius:4px;word-break:break-all}.ok{color:#0a7d33}.err{color:#b00020}</style></head><body>
<h1>ClipperTheKingEv3r</h1>
<p id="msg">Waiting for authorization...</p>
<p id="det"></p>
<p>This page is the redirect target of the TikTok Login Kit flow. Copy the full address of this page (the URL in the browser bar) and paste it into the app on the owner's computer to finish connecting the account.</p>
<p><a href="terms.html">Terms of Service</a> · <a href="privacy.html">Privacy Policy</a></p>
<script>
var p=new URLSearchParams(location.search);
var m=document.getElementById('msg'),d=document.getElementById('det');
if(p.get('code')){m.innerHTML='<span class="ok">Authorization received.</span> You can return to the app.';d.textContent='Scopes granted: '+(p.get('scopes')||'-');}
else if(p.get('error')){m.innerHTML='<span class="err">Authorization was not completed.</span>';d.textContent=p.get('error_description')||p.get('error');}
</script></body></html>
